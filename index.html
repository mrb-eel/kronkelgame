<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kronkel: The Coffeeshop Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="A fan-made game set in Coffeeshop Kronkel on Vlaamsegas, Nijmegen. Work the counter, serve the tables, or run the whole place. Plays on desktop, phone, controller and VR. 18+.">
  <meta name="theme-color" content="#121015">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kronkel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="assets/fonts/ArchivoBlack.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/BarlowCondensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Archivo Black'; src: url('assets/fonts/ArchivoBlack.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-800.woff2') format('woff2'); font-weight: 800 900; font-display: swap; }
    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-500.woff2') format('woff2'); font-weight: 400 600; font-display: swap; }
    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-700.woff2') format('woff2'); font-weight: 700 900; font-display: swap; }
    :root { --ink: #121015; --paper: #f5efe1; --yellow: #ffc814; --red: #d51f2b; --red-deep: #8f1019; --purple: #9a45ff; }
    html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: Barlow, system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    #ui { touch-action: none; outline: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; transition: opacity .6s;
      background: radial-gradient(circle at 50% 30%, rgba(154,69,255,.35), transparent 60%),
                  radial-gradient(rgba(154,69,255,.18) 1.2px, transparent 1.4px) 0 0 / 9px 9px, var(--ink); }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .wrap { text-align: center; padding: 24px; }
    #boot .face { display: block; margin: 0 auto 14px; width: clamp(96px, 22vw, 150px); height: auto;
      filter: drop-shadow(5px 5px 0 var(--ink)); animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(-6deg); } }
    #boot .tiles { display: flex; gap: clamp(4px, 1vw, 8px); justify-content: center; }
    #boot .tiles span { --s: clamp(34px, 9vw, 64px); width: var(--s); height: var(--s); display: grid; place-items: center;
      font: 400 calc(var(--s) * .72)/1 'Archivo Black', Impact, sans-serif; color: #5a5249; background: #8a8174;
      border: calc(var(--s) * .07) solid var(--red-deep); border-radius: calc(var(--s) * .1); box-shadow: 5px 5px 0 #000;
      transition: background .25s, color .25s, box-shadow .25s; }
    #boot .tiles span.on { background: var(--paper); color: var(--red); box-shadow: 5px 5px 0 #000, 0 0 22px rgba(255,243,192,.55); }
    #boot .strip { display: inline-block; margin-top: 16px; padding: 6px 14px; background: #000; color: var(--paper);
      font: 800 clamp(12px, 2.6vw, 16px)/1.2 'Barlow Condensed', sans-serif; letter-spacing: .22em; transform: rotate(-1.5deg); }
    #boot .err { color: #ff8a8a; max-width: 420px; margin: 18px auto 0; font-size: 15px; line-height: 1.4; }
    noscript { color: #fff; position: fixed; inset: 0; display: grid; place-items: center; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="ui" tabindex="0" aria-label="Kronkel game"></canvas>
  <div id="boot">
    <div class="wrap">
      <img class="face" src="assets/images/kronkel-logo.png" alt="" width="150" height="150">
      <div class="tiles" id="boottiles"><span>K</span><span>R</span><span>O</span><span>N</span><span>K</span><span>E</span><span>L</span></div>
      <div class="strip">COFFEESHOP · NIJMEGEN · SINDS 1986</div>
      <div class="err" id="booterr"></div>
    </div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
